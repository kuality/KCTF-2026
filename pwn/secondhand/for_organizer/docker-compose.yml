services:
  secondhand:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SECONDHAND_PORT:-20002}:1337"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    mem_limit: 96m
    cpus: "0.50"
    pids_limit: 64
    ulimits:
      nofile:
        soft: 64
        hard: 64
      nproc: 32
    stop_grace_period: 2s
