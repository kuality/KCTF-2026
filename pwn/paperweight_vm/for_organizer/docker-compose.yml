services:
  paperweight_vm:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-20004}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    mem_limit: 128m
    mem_reservation: 32m
    cpus: "0.50"
    pids_limit: 64
    cap_drop:
      - ALL
    ulimits:
      core: 0
      nofile:
        soft: 64
        hard: 64
      nproc: 32
    stop_grace_period: 5s
