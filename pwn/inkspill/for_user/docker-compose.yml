services:
  inkspill:
    user: "2001:2001"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "20001:1337"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
