x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 64
  mem_limit: 128m
  cpus: 0.50

services:
  common_ground:
    <<: *runtime
    build:
      context: ./common_ground/for_user
      dockerfile: Dockerfile
    ports:
      - "${COMMON_GROUND_PORT:-30000}:8080"

  second_receipt:
    <<: *runtime
    build:
      context: ./second_receipt/for_organizer
      dockerfile: Dockerfile
    ports:
      - "${SECOND_RECEIPT_PORT:-30001}:5000"
    secrets:
      - source: second_receipt_flag
        target: challenge_flag

  zero_contribution:
    <<: *runtime
    build:
      context: ./zero_contribution/for_organizer
      dockerfile: Dockerfile
    ports:
      - "${ZERO_CONTRIBUTION_PORT:-30002}:5000"
    secrets:
      - source: zero_contribution_flag
        target: challenge_flag

  forbidden_counter:
    <<: *runtime
    build:
      context: ./forbidden_counter/for_organizer
      dockerfile: Dockerfile
    ports:
      - "${FORBIDDEN_COUNTER_PORT:-30003}:5000"
    secrets:
      - source: forbidden_counter_flag
        target: challenge_flag

  third_time_frost:
    <<: *runtime
    build:
      context: ./third_time_frost/for_organizer
      dockerfile: Dockerfile
    ports:
      - "${THIRD_TIME_FROST_PORT:-30004}:5000"
    secrets:
      - source: third_time_frost_flag
        target: challenge_flag

secrets:
  second_receipt_flag:
    file: ./second_receipt/for_organizer/flag
  zero_contribution_flag:
    file: ./zero_contribution/for_organizer/flag
  forbidden_counter_flag:
    file: ./forbidden_counter/for_organizer/flag
  third_time_frost_flag:
    file: ./third_time_frost/for_organizer/flag
