name: kctf-2026-web-medical-revenge

services:
  medical-revenge:
    labels:
      category: "web"
      challenge_name: "medical-revenge"
      difficulty: "low"
    container_name: "kctf-2026-web-medical-revenge"
    image: kctf-2026/web-medical-revenge:latest
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "12090:80"

  medical-revenge-database:
    labels:
      category: "medical-revenge-database"
    container_name: "kctf-2026-web-medical-revenge-database"
    image: mariadb:10.5.13
    restart: always
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      
    environment:
      - MYSQL_ROOT_PASSWORD=toor
      - TZ=Asia/Seoul

    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
