name: kctf-2026-web-medical

services:
  medical:
    labels:
      category: "web"
      challenge_name: "medical"
      difficulty: "low"
    container_name: "kctf-2026-web-medical"
    image: kctf-2026/web-medical:latest
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "12083:80"

  medical-database:
    labels:
      category: "medical-database"
    container_name: "kctf-2026-web-medical-database"
    image: mariadb:10.5.13
    restart: always
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      
    environment:
      - MYSQL_ROOT_PASSWORD=toor
      - TZ=Asia/Seoul

    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
