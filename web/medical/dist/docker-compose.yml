version: '2'

services:
  private-medical-information-center:
    labels:
      category: "web"
      challenge_name: "private-medical-information-center"
      difficulty: "low"
    container_name: "ccunictf-web-private-medical-information-center"
    image: ccunictf/web-private-medical-information-center:latest
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "10003:80"

  private-medical-information-center-database:
    labels:
      category: "private-medical-information-center-database"
    container_name: "ccunictf-web-private-medical-information-center-database"
    image: mariadb:10.5.13
    restart: always
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      
    environment:
      - MYSQL_ROOT_PASSWORD=toor
      - TZ=Asia/Seoul

    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci